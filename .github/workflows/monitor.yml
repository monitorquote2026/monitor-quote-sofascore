name: Monitor quote
on:
  schedule:
    - cron: '0 8,12,16,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch odds and update dashboard
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_SPORT: soccer_italy_serie_a
          ODDS_REGIONS: eu
        run: python monitor.py
      - name: Save history and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update odds monitor"
            git push
          fi
